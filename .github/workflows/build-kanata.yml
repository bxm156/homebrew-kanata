name: Build and sign kanata

# Builds kanata from an upstream release tag, signs it with the Developer ID
# certificate held in this repo's secrets, publishes it as a GitHub release,
# and points Formula/kanata.rb at it.
#
# Why sign with a Developer ID: macOS ties a privacy grant (Input Monitoring,
# Accessibility) to the signer and identifier of a Developer ID-signed binary
# rather than to the hash of one build. Every release from this workflow has
# the same signer and identifier, so the grant carries over between versions.
#
# Manual trigger only, on purpose:
#   * the signature says "built by this pipeline", so a person should decide
#     which upstream version gets signed;
#   * the signing secrets are never exposed to pull requests.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "kanata version to build, without the leading v (for example 1.12.0)"
        required: true
        type: string
      revision:
        description: "Rebuild number for the same kanata version (0 for the first build)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write # create the release and push the formula update

concurrency:
  group: build-kanata
  cancel-in-progress: false

env:
  # Fixed code-signing identifier. Together with the Developer ID team it is
  # what macOS matches a privacy grant against, so never change it casually:
  # a different identifier is a different program as far as macOS is concerned.
  SIGN_IDENTIFIER: com.bryanmarty.kanata
  VERSION: ${{ inputs.version }}
  REVISION: ${{ inputs.revision }}

jobs:
  build:
    runs-on: macos-26 # Apple silicon
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Validate inputs
        id: names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.12.0 (got '$VERSION')"
            exit 1
          fi
          if ! [[ "$REVISION" =~ ^[0-9]+$ ]]; then
            echo "::error::revision must be a whole number (got '$REVISION')"
            exit 1
          fi
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::expected an arm64 runner, got $(uname -m)"
            exit 1
          fi

          # Same naming as scripts/update-formula.sh: rebuilds get a _N suffix.
          SUFFIX=""
          if [ "$REVISION" != "0" ]; then SUFFIX="_$REVISION"; fi
          TAG="kanata-v$VERSION$SUFFIX"
          ASSET="kanata-$VERSION$SUFFIX-arm64-apple-darwin.tar.gz"

          # Never replace a published release: its hash is pinned in the formula.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; use a higher revision"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Check out kanata source
        uses: actions/checkout@v4
        with:
          repository: jtroo/kanata
          ref: v${{ inputs.version }}
          path: kanata-src
          persist-credentials: false

      - name: Build kanata
        working-directory: kanata-src
        # Default features, same as the Homebrew core formula.
        run: cargo build --release --locked

      - name: Sign kanata
        id: sign
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/signing.p12"

          # Temporary keychain holding only the signing identity.
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$P12"

          # A Developer ID certificate is only usable if the Apple intermediate
          # that issued it is present. A .p12 exported from Keychain Access
          # usually contains just the leaf, so fetch the intermediates too.
          # Best effort: the runner image may already have them.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            if curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"; then
              security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" >/dev/null 2>&1 || true
            fi
          done

          # codesign only finds identities in keychains on the search list,
          # even when --keychain names one explicitly.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Pick the Developer ID Application identity from the secret. A line
          # looks like:  1) <40 hex> "Developer ID Application: Name (TEAMID)"
          LINE="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 || true)"
          if [ -z "$LINE" ]; then
            security find-identity -p codesigning "$KEYCHAIN" || true
            echo "::error::no valid 'Developer ID Application' identity found in SIGNING_P12_BASE64"
            exit 1
          fi
          IDENTITY_SHA1="$(printf '%s' "$LINE" | awk '{print $2}')"
          TEAM_ID="$(printf '%s' "$LINE" | sed -E 's/.*\(([A-Z0-9]{10})\)"$/\1/')"
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::could not read the team ID from the signing identity"
            exit 1
          fi

          BIN=kanata-src/target/release/kanata

          # --timestamp adds Apple's secure timestamp, so the signature stays
          # valid after the certificate itself expires.
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY_SHA1" \
            --identifier "$SIGN_IDENTIFIER" "$BIN"

          # The requirement every release must satisfy: this identifier, signed
          # by this Developer ID team, chaining to Apple.
          REQUIREMENT="identifier \"$SIGN_IDENTIFIER\" and anchor apple generic and certificate leaf[subject.OU] = \"$TEAM_ID\""
          codesign --verify --strict -R="$REQUIREMENT" "$BIN"
          codesign -dvv "$BIN"
          "$BIN" --version

          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Package
        id: package
        env:
          ASSET: ${{ steps.names.outputs.asset }}
        run: |
          mkdir -p dist/pkg
          cp kanata-src/target/release/kanata dist/pkg/kanata
          cp kanata-src/LICENSE dist/pkg/LICENSE
          tar -czf "dist/$ASSET" -C dist/pkg kanata LICENSE
          SHA256="$(shasum -a 256 "dist/$ASSET" | cut -d' ' -f1)"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$ASSET sha256 $SHA256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.names.outputs.tag }}
          ASSET: ${{ steps.names.outputs.asset }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          TEAM_ID: ${{ steps.sign.outputs.team_id }}
        run: |
          {
            echo "kanata $VERSION for Apple silicon, built from https://github.com/jtroo/kanata/tree/v$VERSION with default features."
            echo
            echo "Signed with identifier \`$SIGN_IDENTIFIER\` by Developer ID team \`$TEAM_ID\`."
            echo
            echo "SHA-256 of \`$ASSET\`: \`$SHA256\`"
            echo
            echo "kanata is licensed LGPL-3.0-only; the source is at the link above."
          } > dist/notes.md
          gh release create "$TAG" "dist/$ASSET" \
            --title "kanata $VERSION (signed)" --notes-file dist/notes.md

      - name: Update formula
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          scripts/update-formula.sh "$VERSION" "$SHA256" "$REVISION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kanata.rb
          git commit -m "kanata $VERSION (revision $REVISION)"
          git push
