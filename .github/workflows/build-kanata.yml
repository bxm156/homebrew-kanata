name: Build and sign kanata

# Builds kanata from an upstream release tag, signs it, publishes it as a
# release in this repository, and points Formula/kanata.rb at it.
#
# Every release is signed with the same certificate and the same identifier.
# macOS ties a privacy grant (Input Monitoring, Accessibility) to that pair
# rather than to one build, so the grant carries over when kanata is upgraded.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "kanata version to build, without the leading v (for example 1.12.0)"
        required: true
        type: string

permissions:
  contents: write # publish the release and push the formula update

env:
  VERSION: ${{ inputs.version }}
  TAG: kanata-v${{ inputs.version }}
  ASSET: kanata-${{ inputs.version }}-arm64-apple-darwin.tar.gz

jobs:
  build:
    runs-on: macos-26 # Apple silicon
    steps:
      - name: Check out this tap
        uses: actions/checkout@v4

      - name: Check out kanata source
        uses: actions/checkout@v4
        with:
          repository: jtroo/kanata
          ref: v${{ inputs.version }}
          path: kanata-src
          persist-credentials: false

      - name: Build kanata
        working-directory: kanata-src
        run: cargo build --release --locked

      - name: Write signing certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
        run: printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"

      # Pinned to a commit because this step handles the private key.
      - name: Sign kanata
        uses: indygreg/apple-code-sign-action@5e7a4a01fe4dffe948ef3bcf1f4538d963cb0c72 # v1.2
        with:
          input_path: kanata-src/target/release/kanata
          p12_file: ${{ runner.temp }}/signing.p12
          p12_password: ${{ secrets.SIGNING_P12_PASSWORD }}
          # The identifier must stay the same in every release: changing it
          # makes macOS treat kanata as a different program.
          sign_args: |
            --binary-identifier
            com.bryanmarty.kanata

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          cp kanata-src/target/release/kanata kanata-src/LICENSE .
          tar -czf "$ASSET" kanata LICENSE
          # Create the release, or replace the asset if it already exists.
          gh release create "$TAG" "$ASSET" --title "kanata $VERSION" \
            --notes "kanata $VERSION for Apple silicon, built from https://github.com/jtroo/kanata/tree/v$VERSION and signed." \
            || gh release upload "$TAG" "$ASSET" --clobber

      - name: Point the formula at the release
        run: |
          SHA256="$(shasum -a 256 "$ASSET" | cut -d' ' -f1)"
          sed -i '' -E \
            -e "s|^  url .*|  url \"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET\"|" \
            -e "s|^  version .*|  version \"$VERSION\"|" \
            -e "s|^  sha256 .*|  sha256 \"$SHA256\"|" \
            Formula/kanata.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kanata.rb
          git diff --cached --quiet || git commit -m "kanata $VERSION"
          git push
