name: Build and sign kanata

# Builds kanata from an upstream release tag, signs it with this repo's
# signing certificate, publishes it as a GitHub release, and points
# Formula/kanata.rb at it.
#
# Manual trigger only, on purpose:
#   * the signature says "built by this pipeline", so a person should decide
#     which upstream version gets signed;
#   * the signing secrets are never exposed to pull requests.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "kanata version to build, without the leading v (for example 1.12.0)"
        required: true
        type: string

permissions:
  contents: write # create the release and push the formula update

concurrency:
  group: build-kanata
  cancel-in-progress: false

env:
  # Must match KANATA_SIGN_ID and SIGNING_CERT in the Makefile: the launcher
  # only runs binaries signed with this identifier by this certificate.
  SIGN_IDENTIFIER: com.bryanmarty.kanata
  CERT_FILE: signing/kanata-signing-cert.pem
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: macos-26 # Apple silicon
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.12.0 (got '$VERSION')"
            exit 1
          fi
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::expected an arm64 runner, got $(uname -m)"
            exit 1
          fi
          # Never replace a published release: its hash is pinned in the formula.
          if gh release view "kanata-v$VERSION" >/dev/null 2>&1; then
            echo "::error::release kanata-v$VERSION already exists"
            exit 1
          fi

      - name: Check out kanata source
        uses: actions/checkout@v4
        with:
          repository: jtroo/kanata
          ref: v${{ inputs.version }}
          path: kanata-src
          persist-credentials: false

      - name: Build kanata
        working-directory: kanata-src
        # Default features, same as the Homebrew core formula.
        run: cargo build --release --locked

      - name: Sign kanata
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/signing.p12"

          # Temporary keychain holding only the signing identity.
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$P12"

          # Select the identity by the hash of the certificate committed in
          # this repo. If the secret holds a different key, signing fails here
          # instead of producing a binary the launcher would reject.
          CERT_SHA1="$(openssl x509 -in "$CERT_FILE" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
          BIN=kanata-src/target/release/kanata

          codesign --force --keychain "$KEYCHAIN" --sign "$CERT_SHA1" \
            --identifier "$SIGN_IDENTIFIER" "$BIN"

          # Same requirement the launcher enforces.
          codesign --verify --strict \
            -R="identifier \"$SIGN_IDENTIFIER\" and certificate leaf = H\"$CERT_SHA1\"" "$BIN"
          codesign -dvv "$BIN"
          "$BIN" --version

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Package
        id: package
        run: |
          ASSET="kanata-$VERSION-arm64-apple-darwin.tar.gz"
          mkdir -p dist/pkg
          cp kanata-src/target/release/kanata dist/pkg/kanata
          cp kanata-src/LICENSE dist/pkg/LICENSE
          tar -czf "dist/$ASSET" -C dist/pkg kanata LICENSE
          SHA256="$(shasum -a 256 "dist/$ASSET" | cut -d' ' -f1)"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$ASSET sha256 $SHA256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          {
            echo "kanata $VERSION for Apple silicon, built from https://github.com/jtroo/kanata/tree/v$VERSION with default features."
            echo
            echo "Signed with identifier \`$SIGN_IDENTIFIER\` by the certificate in \`$CERT_FILE\`."
            echo
            echo "SHA-256 of \`$ASSET\`: \`$SHA256\`"
            echo
            echo "kanata is licensed LGPL-3.0-only; the source is at the link above."
          } > dist/notes.md
          gh release create "kanata-v$VERSION" "dist/$ASSET" \
            --title "kanata $VERSION (signed)" --notes-file dist/notes.md

      - name: Update formula
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          scripts/update-formula.sh "$VERSION" "$SHA256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kanata.rb
          git commit -m "kanata $VERSION"
          git push
