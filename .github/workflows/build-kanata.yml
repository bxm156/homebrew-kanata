name: Build and sign kanata

# Builds kanata from an upstream release tag, signs it with this repo's
# self-signed certificate, publishes it as a GitHub release, and points
# Formula/kanata.rb at it.
#
# Why sign with one fixed certificate: macOS ties a privacy grant (Input
# Monitoring, Accessibility) for a certificate-signed binary to its identifier
# and signing certificate rather than to the hash of one build. Every release
# from this workflow has the same identifier and certificate, so the grant
# carries over between versions, and a binary signed by anything else does
# not match it.
#
# Manual trigger only, on purpose:
#   * the signature says "built by this pipeline", so a person should decide
#     which upstream version gets signed;
#   * the signing secrets are never exposed to pull requests.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "kanata version to build, without the leading v (for example 1.12.0)"
        required: true
        type: string
      revision:
        description: "Rebuild number for the same kanata version (0 for the first build)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write # create the release and push the formula update

concurrency:
  group: build-kanata
  cancel-in-progress: false

env:
  # Fixed code-signing identifier. Together with the certificate it is what
  # macOS matches a privacy grant against, so never change it casually: a
  # different identifier is a different program as far as macOS is concerned.
  SIGN_IDENTIFIER: com.bryanmarty.kanata
  # Public half of the signing certificate. The private key exists only in the
  # SIGNING_P12_BASE64 / SIGNING_P12_PASSWORD secrets.
  CERT_FILE: signing/kanata-signing-cert.pem
  VERSION: ${{ inputs.version }}
  REVISION: ${{ inputs.revision }}

jobs:
  build:
    runs-on: macos-26 # Apple silicon
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Validate inputs
        id: names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.12.0 (got '$VERSION')"
            exit 1
          fi
          if ! [[ "$REVISION" =~ ^[0-9]+$ ]]; then
            echo "::error::revision must be a whole number (got '$REVISION')"
            exit 1
          fi
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::expected an arm64 runner, got $(uname -m)"
            exit 1
          fi

          # Same naming as scripts/update-formula.sh: rebuilds get a _N suffix.
          SUFFIX=""
          if [ "$REVISION" != "0" ]; then SUFFIX="_$REVISION"; fi
          TAG="kanata-v$VERSION$SUFFIX"
          ASSET="kanata-$VERSION$SUFFIX-arm64-apple-darwin.tar.gz"

          # Never replace a published release: its hash is pinned in the formula.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; use a higher revision"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Check out kanata source
        uses: actions/checkout@v4
        with:
          repository: jtroo/kanata
          ref: v${{ inputs.version }}
          path: kanata-src
          persist-credentials: false

      - name: Build kanata
        working-directory: kanata-src
        # Default features, same as the Homebrew core formula.
        run: cargo build --release --locked

      - name: Write signing certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
        run: printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"

      # Signs with rcodesign, which reads the .p12 directly, so no keychain
      # has to be created, unlocked or put on the search list.
      # Pinned to a commit because this step handles the private key.
      - name: Sign kanata
        uses: indygreg/apple-code-sign-action@5e7a4a01fe4dffe948ef3bcf1f4538d963cb0c72 # v1.2
        with:
          input_path: kanata-src/target/release/kanata
          p12_file: ${{ runner.temp }}/signing.p12
          p12_password: ${{ secrets.SIGNING_P12_PASSWORD }}
          # One argument per line, passed to `rcodesign sign`.
          sign_args: |
            --binary-identifier
            ${{ env.SIGN_IDENTIFIER }}

      - name: Remove signing certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.p12"

      # Check the result with Apple's own codesign, not the tool that signed
      # it. This is what guarantees the release matches the privacy grant.
      - name: Verify signature
        run: |
          CERT_SHA1="$(openssl x509 -in "$CERT_FILE" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
          BIN=kanata-src/target/release/kanata

          # Signed with this identifier by the certificate committed in this
          # repo. If the secret held a different key, this fails.
          #
          # macOS records a binary's designated requirement when a privacy
          # grant is made, and later builds must satisfy it. For a self-signed
          # certificate that requirement names the certificate either as the
          # "leaf" or as the "root" of the chain, depending on which tool
          # signed the binary that was granted (the certificate is both). Check
          # both forms, so a release matches a grant made against any earlier
          # release.
          for position in leaf root; do
            codesign --verify --strict \
              -R="identifier \"$SIGN_IDENTIFIER\" and certificate $position = H\"$CERT_SHA1\"" "$BIN"
          done

          codesign -d -r- "$BIN"
          codesign -dvv "$BIN"
          "$BIN" --version

      - name: Package
        id: package
        env:
          ASSET: ${{ steps.names.outputs.asset }}
        run: |
          mkdir -p dist/pkg
          cp kanata-src/target/release/kanata dist/pkg/kanata
          cp kanata-src/LICENSE dist/pkg/LICENSE
          tar -czf "dist/$ASSET" -C dist/pkg kanata LICENSE
          SHA256="$(shasum -a 256 "dist/$ASSET" | cut -d' ' -f1)"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$ASSET sha256 $SHA256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.names.outputs.tag }}
          ASSET: ${{ steps.names.outputs.asset }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          {
            echo "kanata $VERSION for Apple silicon, built from https://github.com/jtroo/kanata/tree/v$VERSION with default features."
            echo
            echo "Signed with identifier \`$SIGN_IDENTIFIER\` by the certificate in \`$CERT_FILE\`."
            echo
            echo "SHA-256 of \`$ASSET\`: \`$SHA256\`"
            echo
            echo "kanata is licensed LGPL-3.0-only; the source is at the link above."
          } > dist/notes.md
          gh release create "$TAG" "dist/$ASSET" \
            --title "kanata $VERSION (signed)" --notes-file dist/notes.md

      - name: Update formula
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          scripts/update-formula.sh "$VERSION" "$SHA256" "$REVISION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kanata.rb
          git commit -m "kanata $VERSION (revision $REVISION)"
          git push
